  # ------------------------------------------------- Wording shared across pages
  - name: shared-text
    label: Wording shared across pages
    description: >-
      Headings and sentences that are the same on many pages: every therapy,
      assessment and audience page (such as Adults or Children), every
      telehealth town page, and the crisis support note. A change here shows
      on all of those pages.
    type: file
    path: src/data/shared-text.json
    format: json
    operations:
      delete: false
    fields:
      - name: crisisNote
        label: "Crisis support note"
        description: >-
          Shown on pages and articles about depression, trauma or self-harm,
          where "Show the crisis support note" is switched on. Check any
          change with a clinician. Phone numbers are links written like [13
          11 14](tel:131114).
        type: text
        required: true
      - name: servicePages
        label: "Therapy and assessment pages"
        description: >-
          The headings and sentences every therapy, assessment and audience
          page shares. Each page's own text is under "Therapy and assessment
          pages".
        type: object
        fields:
          - name: contentsHeading
            label: "Heading of the \"On this page\" list"
            type: string
            required: true
          - name: therapyPagesHeading
            label: "Audience pages: heading over their therapy pages"
