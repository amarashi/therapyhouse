# Pages CMS configuration (issue #97): the editing screens clinic staff use.
# Docs: https://pagescms.org/docs/configuration/
#
# Who reads this: reception and the practice manager see its labels and help
# text, so those are written in plain clinic language. Field names (`lede`,
# `draft`, ...) are the developer's and never shown.
#
# Kept in step with the build by tests/pages-cms-config.test.mjs:
#   - every field of a Markdown collection here exists in the schema in
#     src/lib/content-schemas.js, and every schema field is here (or on the
#     short list in the test of fields no page uses);
#   - every select offers exactly the values the schema or the build accepts;
#   - every JSON file's fields match the keys in the file;
#   - fields only the developer may change (ids, addresses, `sourceUrl`,
#     `documentTitle`) are `hidden` or `readonly`.
# A failing test names the field. Change the schema, the content and this file
# together.
#
# Developer-only and therefore not here at all: Medicare amounts
# (src/data/medicare.js), redirects (docs/redirects.md), the house's scene
# positions and tuning (public/assets/scripts/), and the library shelf's shapes
# and colours (src/data/library-shelf.js).
#
# Headings and sentences a template prints around a page's content are here
# too: each page's own in its "Headings and short text" group, and those many
# pages share (service, audience and town pages, the crisis note) in "Wording
# shared across pages" (src/data/shared-text.json). A sentence there may hold
# a link written [words](/page/); src/lib/inline-text.js turns it into a link
# and escapes everything else. Sentences that state a Medicare figure stay in
# the templates, beside src/data/medicare.js.
#
# "Show on the live website" (issue #95): the files store `draft: true` for
# "switched off". Pages CMS shows a boolean as one switch and cannot invert it
# or relabel its two positions, and a select would save the text "false"
# instead of the boolean false, which the build rejects. So the switch is
# labelled for what `true` means: "Hidden from the live website".

settings:
  content:
    # Keep any key the form does not list (YAML comments are still lost when
    # a file is saved; Pages CMS rewrites the whole front matter).
    merge: true

media:
  - name: team
    label: Team photos
    # One photograph per person; the build makes the four sizes the site uses
    # (src/lib/team-portraits.js, issue #96). Never served as uploaded.
    input: src/assets/team
    output: /assets/team
    extensions: [jpg, jpeg, png, webp]
    rename: safe
  - name: library
    label: Article pictures
    # Article header pictures and pictures inside articles. Keep each under
    # 300 KB (tests/articles.test.mjs); WebP is smallest.
    input: public/assets/library
    output: /assets/library
    extensions: [jpg, jpeg, png, webp]
    rename: safe

components:
  draft:
    label: Hidden from the live website
    description: >-
      Switch on to keep this off the clinic's real website without deleting
      it. It still appears on the Preview site, marked as a draft, so it can be
      checked first. Switch off to publish it.
    type: boolean
  feeRow:
    label: Fees
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{fields.label}: {fields.amount}"
    fields:
      - name: label
        label: What the fee is for
        type: string
        required: true
      - name: amount
        label: Price
        description: As written on the page, for example "$260", "from $1,000" or "+$10".
        type: string
        required: true
      - name: note
        label: Note under the price
        type: string
      - name: adjustment
        label: Added on top of a session fee
        description: Switch on for extras such as the evening fee, so they are listed apart from the session prices.
        type: boolean
      - name: group
        label: Group in the fee table
        description: Leave empty for the psychologists' session fees, which head the table.
        type: select
        options:
          values:
            - value: provisional
              label: Provisional psychologists
            - value: couples-family
              label: Couples and family sessions
      - name: draft
        component: draft
  houseProgram:
    type: object
    fields:
      - name: title
        label: Name
        type: string
        required: true
      - name: audience
        label: Who it is for
        type: string
      - name: description
        label: Description
        type: text
        required: true

content:
  # ------------------------------------------------------------------ Team
  - name: team
    label: Team
    description: >-
      One page per person. Add a new person with "Add an entry"; they start
      hidden from the live website so the clinic can check their page on the
      Preview first. People cannot be deleted here: switch them to hidden
      instead, because articles and service pages may name them.
    type: collection
    path: src/content/team
    filename: "{name}.md"
    format: yaml-frontmatter
    subfolders: false
    operations:
      rename: false
      delete: false
    view:
      primary: name
      fields: [name, role, draft]
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        description: As it should appear on the website, for example "Dr Amelia Shay".
        type: string
        required: true
      - name: role
        label: Job title
        type: string
        required: true
      - name: kind
        label: Type of team member
        description: Practitioners are listed first, then support staff, then the clinic dogs.
        type: select
        required: true
        options:
          values:
            - value: practitioner
              label: Practitioner (sees clients)
            - value: support
              label: Support staff
            - value: dog
              label: Clinic dog
      - name: order
        label: Position on the team page
        description: 1 is first. People of the same type are listed in this order.
        type: number
        required: true
        options:
          min: 1
      - name: image
        label: Photo
        description: >-
          One clear portrait photo (JPG, PNG or WebP). The website crops it to a
          tall rectangle and makes the smaller sizes itself.
        type: image
        required: true
        options:
          media: team
      - name: imageAlt
        label: Photo description
        description: >-
          One sentence describing the photo for people who cannot see it, for
          example "Portrait of Dr Amelia Shay, developmental psychologist at
          Therapy House in Brisbane".
        type: string
        required: true
      - name: summary
        label: Short introduction
        description: Two or three sentences shown on the team card and at the top of their page.
        type: text
        required: true
      - name: credentials
        label: Qualifications
        description: For example "PhD, MPsy, BPsySc". Leave empty if not published.
        type: string
      - name: worksWith
        label: Works with
        description: >-
          Practitioners only, up to 4. Each choice is one the clinic has signed
          off in docs/team-specialisms-review.md; a new person needs a section
          there (ask the developer) before they can be shown on the live
          website.
        type: select
        options:
          multiple: true
          max: 4
          values:
            - Adolescents
            - Adults
            - All ages
            - Children
            - Couples
            - Families
            - Parents
            - Young adults
            - Young people
      - name: worksOn
        label: Works on
        description: >-
          Practitioners only, up to 5. Same sign-off rule as "Works with".
        type: select
        options:
          multiple: true
          max: 5
          values:
            - ADHD
            - Anxiety
            - Assessment
            - Autism
            - Chronic health
            - Complex trauma
            - Depression
            - Developmental delay
            - Domestic and family violence
            - Early intervention
            - Eating disorders
            - Emotional dysregulation
            - Grief
            - Learning difficulties
            - Low mood
            - Neurodevelopmental conditions
            - Trauma
      - name: languages
        label: Languages they work in
        description: Include English. Leave empty for support staff and the dogs.
        type: string
        list: true
      - name: availability
        label: Availability for new clients
        description: >-
          Use the clinic's usual wording: "Accepting new clients", "Active
          waitlist for new clients", "Not currently accepting new clients" or
          "On leave". Leave empty to say nothing. Change it in House > House
          text > Team as well, so the illustrated house agrees.
        type: string
      - name: ahpra
        label: AHPRA registration number
        type: string
      - name: sourceUrl
        label: Address on the old website
        type: string
        hidden: true
      - name: draft
        component: draft
        description: >-
          Switch on to keep this person off the clinic's real website: the team
          page, the home page, service pages, article bylines and the house.
          Their page still appears on the Preview site, marked as a draft. New
          people start switched on.
        default: true
      - name: body
        label: Full biography
        type: rich-text

  # -------------------------------------------------------------- Articles
  - name: articles
    label: Articles
    description: >-
      The library's articles. New articles start hidden from the live website
      until a clinician has reviewed them. To take an article down, prefer
      hiding it: deleting one of the articles that came from the old website
      stops the website from updating, because its old address must keep
      working.
    type: collection
    path: src/content/articles
    filename: "{title}.md"
    format: yaml-frontmatter
    subfolders: false
    operations:
      rename: false
    view:
      primary: title
      fields: [title, date, category, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        description: >-
          The heading. The page's address is made from it when the article is
          first saved and does not change afterwards.
        type: string
        required: true
      - name: documentTitle
        label: Title in search results
        type: string
        hidden: true
      - name: description
        label: Summary for search results
        description: One or two sentences, under 160 characters. Must be different from every other article's.
        type: text
        required: true
        options:
          maxlength: 159
      - name: date
        label: Date first published
        type: date
        required: true
      - name: updated
        label: Date last updated
        description: Leave empty unless the article has been meaningfully revised.
        type: date
        default: ""
      - name: author
        label: Written by
        description: >-
          Leave empty for articles from the clinic as a whole. Someone newly
          added to the team appears here after the developer adds them.
        type: select
        options:
          values:
            - value: amelia-shay
              label: Dr Amelia Shay
            - value: kaya-beinke
              label: Dr Kaya Beinke
            - value: letitia-mcvey
              label: Letitia McVey
            - value: sahar-fattahi
              label: Sahar Fattahi
            - value: rani-banks
              label: Rani Banks
            - value: jazmin-squire
              label: Jazmin Squire
            - value: laura-storey
              label: Laura Storey
            - value: genevieve-hussey
              label: Genevieve Hussey
      - name: category
        label: Topic
        description: >-
          One of the topics already in use where possible: Therapy, Children,
          Assessments, Emotion Regulation, Parenting, Relationships, News or
          Blog.
        type: string
        required: true
      - name: sourceUrl
        label: Address on the old website
        type: string
        hidden: true
      - name: image
        label: Header picture
        description: Under 300 KB. WebP is smallest.
        type: image
        options:
          media: library
      - name: imageAlt
        label: Header picture description
        description: Required when there is a header picture. One sentence describing it for people who cannot see it.
        type: string
      - name: crisisNote
        label: Show the crisis support note
        description: Adds the Lifeline and 000 note. Switch on for articles about depression, trauma or self-harm.
        type: boolean
      - name: draft
        component: draft
        description: >-
          Switch on to keep this article off the clinic's real website. It
          still appears on the Preview site, marked as a draft. New articles
          start switched on.
        default: true
      - name: body
        label: Article
        description: Every picture needs a description (its alt text).
        type: rich-text
        options:
          media: library

  # -------------------------------------------------------------- Services
  - name: services
    label: Therapy and assessment pages
    description: >-
      One page per therapy or assessment. New pages are added by the
      developer, because each needs an address and a place in the menus.
      Each page is written to be found in Google by one phrase, which must
      stay in its "Title in search results", "Summary for search results" and
      opening, and its main word in the heading (the help on those fields
      lists them).
    type: collection
    path: src/content/services
    format: yaml-frontmatter
    subfolders: false
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: h1
      fields: [h1, kind, feeStatus, draft]
      sort: [h1]
    fields:
      - name: title
        label: Title in search results
        description: >-
          Shown in Google results and the browser tab. Under 60 characters,
          different from every other page's, and containing each word of the
          page's search phrase: Adult and Child ADHD assessment "ADHD
          assessment"; Adult and Child autism assessment "autism assessment";
          Learning "dyslexia"; Cognitive "cognitive"; Adults "psychologist for
          adults"; Children "child psychologist"; Trauma "trauma therapy";
          Anxiety "anxiety psychologist"; Depression "depression counselling";
          Grief "grief counselling"; Couples "couples counselling"; Our
          approaches "CBT"; NDIS "NDIS psychologist"; Circle of Security
          "circle of security parenting program"; Family "family therapy".
        type: string
        required: true
        options:
          maxlength: 60
      - name: h1
        label: Heading on the page
        description: >-
          Must contain the page's main word: on the assessment pages the whole
          search phrase (for example "ADHD assessment"); otherwise "adults",
          "children", "trauma", "anxiety", "counselling" (Depression), "grief",
          "couples", "therap" (Our approaches), "NDIS", "circle of security" or
          "family".
        type: string
        required: true
      - name: description
        label: Summary for search results
        description: >-
          One or two sentences, under 160 characters, different from every
          other page's. Must contain each word of the search phrase listed
          under "Title in search results" (Depression: "depression" and
          "psychologist"; NDIS: "NDIS" and "psycholog").
        type: text
        required: true
        options:
          maxlength: 160
      - name: lede
        label: Opening sentence (shown larger)
        description: >-
          The search phrase listed under "Title in search results" must appear
          here. On pages other than assessments it may instead be in the first
          paragraph of the page text.
        type: text
        required: true
      - name: kind
        label: Kind of page
        type: select
        hidden: true
        options:
          values: [therapy, assessment, hub]
      - name: path
        label: Address
        type: string
        hidden: true
      - name: hubGroup
        label: Heading it sits under on the Therapy page
        description: Leave empty if unsure; the page is then listed under the last heading.
        type: select
        options:
          values:
            - value: adults
              label: Adults
            - value: children-families
              label: Children and families
            - value: couples
              label: Couples
            - value: how-we-work
              label: How we work
      - name: audiences
        label: Written for
        description: Not shown on the page. Used to group pages behind the scenes.
        type: select
        required: true
        options:
          multiple: true
          values:
            - value: local-family
              label: Local families
            - value: telehealth
              label: People seen by video
            - value: adult
              label: Adults seeking help for themselves
      - name: clinicians
        label: Clinicians who offer this
        description: Someone newly added to the team appears here after the developer adds them.
        type: select
        options:
          multiple: true
          values:
            - value: amelia-shay
              label: Dr Amelia Shay
            - value: kaya-beinke
              label: Dr Kaya Beinke
            - value: letitia-mcvey
              label: Letitia McVey
            - value: sahar-fattahi
              label: Sahar Fattahi
            - value: rani-banks
              label: Rani Banks
            - value: jazmin-squire
              label: Jazmin Squire
            - value: laura-storey
              label: Laura Storey
            - value: genevieve-hussey
              label: Genevieve Hussey
      - name: formats
        label: How sessions happen
        type: select
        options:
          multiple: true
          values:
            - value: in-room
              label: In person at the clinic
            - value: video
              label: By video
      - name: diagnoses
        label: Conditions this assessment can diagnose
        description: Assessment pages only. Not shown as a list; tells search engines what the assessment is for.
        type: string
        list: true
      - name: process
        label: Steps, in order
        type: text
        list: true
      - name: fees
        component: feeRow
      - name: feeStatus
        label: Are these prices published?
        description: >-
          "Not yet confirmed" shows the prices on the Preview only, marked, and
          stops the live website from updating until it is changed.
        type: select
        options:
          values:
            - value: published
              label: Published by the clinic
            - value: quote
              label: No price published (call for a quote)
            - value: needs-confirmation
              label: Not yet confirmed by the clinic
      - name: sessionFees
        label: Charged at the usual session fees
        description: Switch on to point to the Fees page instead of listing prices here.
        type: boolean
      - name: medicare
        label: Medicare notes
        description: Plain sentences. Rebate amounts are kept by the developer and are not typed here.
        type: text
        list: true
      - name: faqs
        label: Questions and answers
        description: Only questions the clinic has actually answered.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.question}"
        fields:
          - name: question
            label: Question
            type: string
            required: true
          - name: answer
            label: Answer
            type: text
            required: true
      - name: related
        label: Related pages
        type: select
        options:
          multiple: true
          values:
            - value: adult-adhd
              label: Adult ADHD assessment
            - value: adult-autism
              label: Adult autism assessment
            - value: adults
              label: Therapy for adults
            - value: anxiety
              label: Anxiety
            - value: approaches
              label: Our approaches
            - value: child-adhd
              label: Child ADHD assessment
            - value: child-autism
              label: Child autism assessment
            - value: children
              label: Therapy for children
            - value: circle-of-security
              label: Circle of Security
            - value: cognitive
              label: Cognitive assessment
            - value: couples
              label: Couples therapy
            - value: depression
              label: Depression
            - value: family
              label: Family therapy
            - value: grief
              label: Grief
            - value: learning
              label: Learning assessment
            - value: ndis
              label: NDIS
            - value: trauma
              label: Trauma
      - name: sourceUrl
        label: Address on the old website
        type: string
        hidden: true
      - name: lastReviewed
        label: Facts last checked on
        description: The date someone at the clinic last confirmed the facts and prices on this page. Shown on the page.
        type: date
        default: ""
      - name: redirectFrom
        label: Old addresses that lead here
        type: string
        list: true
        hidden: true
      - name: crisisNote
        label: Show the crisis support note
        description: Adds the Lifeline and 000 note under the opening. Switch on for pages about depression, trauma or self-harm.
        type: boolean
      - name: draft
        component: draft
      - name: body
        label: Page text
        type: rich-text

  # ----------------------------------------------------------------- Towns
  - name: towns
    label: Telehealth towns
    description: >-
      Queensland towns named on the Telehealth page. Every fact needs the web
      page it came from. A town with its own page needs at least three facts.
    type: collection
    path: src/content/towns
    format: yaml-frontmatter
    subfolders: false
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: name
      fields: [name, kind, draft]
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Town
        type: string
        required: true
      - name: kind
        label: Own page or a paragraph
        type: select
        hidden: true
        options:
          values: [page, section]
      - name: order
        label: Position on the Telehealth page
        type: number
        required: true
      - name: facts
        label: Facts about the town
        type: object
        required: true
        list:
          collapsible:
            collapsed: true
            summary: "{fields.text}"
        fields:
          - name: text
            label: The fact, as one plain sentence
            type: text
            required: true
          - name: sourceName
            label: Where it comes from
            description: The publisher and date, for example "Mount Isa City Council".
            type: string
            required: true
          - name: sourceUrl
            label: Web address of the source
            description: The page the fact was read on, starting https://. Listed on the page as a source.
            type: string
            required: true
            pattern:
              regex: ^https?://\S+$
              message: A full web address, starting https://
      - name: title
        label: Title in search results
        description: >-
          Towns with their own page only. Under 60 characters, and must contain
          the words "psychologist", "video" and the town's name.
        type: string
        options:
          maxlength: 60
      - name: h1
        label: Heading on the page
        description: Towns with their own page only. Must contain the town's name.
        type: string
      - name: description
        label: Summary for search results
        description: Towns with their own page only. Under 160 characters, and must contain the town's name.
        type: text
        options:
          maxlength: 160
      - name: lede
        label: Opening sentence (shown larger)
        description: Towns with their own page only.
        type: text
      - name: draft
        component: draft
      - name: body
        label: Page text
        description: >-
          Towns with their own page: the first paragraph must name the town and
          say "psychologist", and the page must keep a section mentioning a "GP
          referral in" the town (for example "A GP referral in Cairns").
        type: rich-text

  # ----------------------------------------------------------------- Pages
  - name: pages
    label: Pages
    type: group
    items:
      - name: page-home
        label: Home
        type: file
        path: src/content/pages/home.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            label: Page name
            type: string
            required: true
          - name: documentTitle
            label: Title in search results
            type: string
            hidden: true
          - name: description
            label: Summary for search results
            description: One or two sentences, under 160 characters.
            type: text
            required: true
            options:
              maxlength: 160
          # Not shown on the home page today (src/pages/index.astro); kept in
          # the file for when the clinic decides where the sentence goes.
          - name: lede
            label: Opening sentence
            type: text
            hidden: true
          - name: headline
            label: Headline
            type: string
            hidden: true
          - name: headlineAccent
            label: Headline, second part
            type: string
            hidden: true
          - name: routes
            label: Cards linking to the main sections
            description: >-
              Each card leads to one section of the site; the picture and the
              link are set by the developer. Prices in the note must be ones
              already published on that section's page.
            type: object
            list:
              min: 4
              max: 4
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            fields:
              - name: title
                label: Card heading
                type: string
                required: true
              - name: description
                label: Card text
                type: text
                required: true
              - name: note
                label: Price or ages line
                type: string
              - name: href
                label: Link
                type: string
                hidden: true
              - name: linkText
                label: Link wording
                type: string
                required: true
              - name: image
                label: Picture
                type: string
                hidden: true
              - name: draft
                component: draft
          - name: practicalNotes
            label: Practical notes (location and parking)
            type: string
            list: true
          - name: body
            label: Page text
            type: rich-text

      - name: page-services
        label: Therapy (overview page)
        type: file
        path: src/content/pages/services.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            label: Heading on the page
            type: string
            required: true
          - name: documentTitle
            label: Title in search results
            type: string
            hidden: true
          - name: description
            label: Summary for search results
            description: One or two sentences, under 160 characters.
            type: text
            required: true
            options:
              maxlength: 160
          - name: lede
            label: Opening sentence (shown larger)
            type: text
            required: true
          - name: sourceUrl
            label: Address on the old website
            type: string
            hidden: true
          - name: offerings
            label: Services offered
            description: The illustrated house shows the same list (House > House text > Services); change both the same way.
            type: text
            list: true
          - name: therapyModels
            label: Therapy approaches
            description: The illustrated house shows the same list (House > House text > Services); change both the same way.
            type: text
            list: true
          - name: therapyHubText
            label: Headings and short text
            description: >-
              The headings and short sentences around the lists on this
              page. The lists of pages fill themselves in from "Therapy and
              assessment pages".
            type: object
            fields:
              - name: audienceHeading
                label: "Heading over the pages for children, adults and so on"
                type: string
                required: true
              - name: groupsHeading
                label: "Heading over the therapy pages"
                type: string
                required: true
              - name: groupHeadings
                label: "Headings of the groups of therapy pages"
                description: >-
                  Which group a page is in is set on the page itself, as
                  "Heading it sits under on the Therapy page".
                type: object
                fields:
                  - name: adults
                    label: "Pages for adults"
                    type: string
                    required: true
                  - name: childrenFamilies
                    label: "Pages for children and families"
                    type: string
                    required: true
