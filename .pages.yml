  # --------------------------------------------------------- Clinic details
  - name: clinic
    label: Clinic details
    description: Phone, email, address and the short notes about getting here. Used on every page and in the house.
    type: file
    path: public/assets/content/clinic.json
    format: json
    operations:
      delete: false
    fields:
      - name: tagline
        label: Tagline
        type: string
        required: true
      - name: phone
        label: Phone
        description: Written the way it should be read, for example "07 3300 2170".
        type: string
        required: true
        pattern:
          regex: ^0\d \d{4} \d{4}$
          message: Ten digits as "07 3300 2170"
      - name: fax
        label: Fax
        type: string
      - name: email
        label: Email
        type: string
        required: true
        pattern:
          regex: ^[^@\s]+@[^@\s]+\.[a-z]{2,}$
          message: An email address
      - name: address
        label: Address, on one line
        type: string
        required: true
      - name: postalAddress
        label: Address, in parts (for search engines)
        description: The same address as above, split up. Keep the two the same.
        type: object
        fields:
          - name: streetAddress
            label: Street
            type: string
            required: true
          - name: addressLocality
            label: Suburb
            type: string
            required: true
          - name: addressRegion
            label: State
            type: string
            required: true
          - name: postalCode
            label: Postcode
            type: string
            required: true
          - name: addressCountry
            label: Country code
            type: string
            readonly: true
      - name: bookingUrl
        label: Online booking link
        description: Ask the developer to change it.
        type: string
        readonly: true
      - name: intro
        label: About the location
        type: text
        list: true
      - name: nearbySuburbs
        label: Nearby suburbs
        description: Named on the home and contact pages, as in "a short drive from Ashgrove, Bardon and Keperra".
        type: string
        list: true
      - name: openingHours
        label: Opening hours
        description: >-
          Leave empty until the clinic has confirmed its hours. Search engines
          show these to people, so wrong hours send a parent to a locked door.
        type: object
        list: true
        fields:
          - name: dayOfWeek
            label: Days
            type: select
            required: true
            options:
              multiple: true
              values: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          - name: opens
            label: Opens at
            description: 24-hour time, for example "08:00".
            type: string
            required: true
            pattern:
              regex: ^([01]\d|2[0-3]):[0-5]\d$
              message: A 24-hour time such as 08:00
          - name: closes
            label: Closes at
            description: 24-hour time, for example "18:00".
            type: string
            required: true
            pattern:
              regex: ^([01]\d|2[0-3]):[0-5]\d$
              message: A 24-hour time such as 18:00

